global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Мониторинг самого Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Мониторинг твоих ботов (HH Core)
  - job_name: 'hh_bots'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          # РЕКРУТЕР 1 (ID: 6 - Долгополова Марина)
          - 'zz_scanner_r6:8000'
          - 'zz_worker_6:8000'
          
          # РЕКРУТЕР 2 (ID: 21 - Измайлова Анастасия)
          - 'zz_scanner_21:8000'
          - 'zz_worker_21:8000'
          
          # ОБЩИЕ (ID: 0 / Резерв)
          - 'zz_scanner_0:8000'
          - 'zz_worker_0:8000'
          
          # ВСПОМОГАТЕЛЬНЫЕ СЕРВИСЫ
          - 'zz_reminders:8000'
          - 'zz_tg_bot:8000'

    # Переименовываем метку instance, чтобы вместо "zz_worker_6:8000" было просто "zz_worker_6"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '$1'