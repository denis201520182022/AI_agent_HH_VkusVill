global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'hh_bots'
    # Используем DNS Discovery Докера. 
    # Prometheus будет спрашивать DNS сервер: "Дай мне IP всех контейнеров с именем hh_worker"
    dns_sd_configs:
      - names:
          - hh_worker
          - hh_scanner
          - hh_reminders
          # --- ДОБАВЛЕНЫ НОВЫЕ СЕРВИСЫ ---
          - worker_r1
          - scanner_r1
          - worker_r2
          - scanner_r2
          # -------------------------------
        type: 'A'
        port: 8000