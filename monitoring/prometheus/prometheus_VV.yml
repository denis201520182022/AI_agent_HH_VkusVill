global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Мониторинг самого Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Мониторинг всех воркеров и сканеров ВкусВилл
  - job_name: 'vkusvill_bots'
    metrics_path: '/metrics' # Стандартный путь для большинства библиотек прометеуса
    static_configs:
      - targets:
          # Группа 36, 49, 47
          - 'vv_worker_36_49_47:8000'
          - 'vv_scanner_36_49_47:8000'
          
          # Группа 29, 40, 45
          - 'vv_worker_29_40_45:8000'
          - 'vv_scanner_29_40_45:8000'
          
          # Группа 32, 39, 44
          - 'vv_worker_32_39_44:8000'
          - 'vv_scanner_32_39_44:8000'
          
          # Группа 48, 33, 50
          - 'vv_worker_48_33_50:8000'
          - 'vv_scanner_48_33_50:8000'
          
          # Группа 46, 7, 42
          - 'vv_worker_46_7_42:8000'
          - 'vv_scanner_46_7_42:8000'
          
          # Группа 43, 38, 28
          - 'vv_worker_43_38_28:8000'
          - 'vv_scanner_43_38_28:8000'
          
          # Группа 41, 51, 37
          - 'vv_worker_41_51_37:8000'
          - 'vv_scanner_41_51_37:8000'
          
          # Общие сервисы
          - 'vv_reminders:8000'
          - 'vv_tg_bot:8000'

    # Переименовываем метку instance, чтобы в Графане было удобно фильтровать
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '$1'