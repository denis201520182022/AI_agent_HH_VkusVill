server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://zz_loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: zabota_docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(zz_.*)'
        target_label: 'container'
      - source_labels: ['container']
        action: keep

