auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # --- ИСПРАВЛЕНИЕ ОШИБКИ ResourceExhausted (увеличиваем лимит до 16МБ) ---
  grpc_server_max_recv_msg_size: 16777216
  grpc_server_max_send_msg_size: 16777216
  # -------------------------------------------------------------------------

common:
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# --- ТВОЯ НОВАЯ СЕКЦИЯ (Полезна для приема больших объемов логов) ---
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 20          # Лимит скорости приема
  ingestion_burst_size_mb: 40    # Разрешенные всплески
  # Дополнительно рекомендую увеличить лимиты на запросы, раз у вас много логов:
  max_entries_limit_per_query: 5000
# -------------------------------------------------------------------