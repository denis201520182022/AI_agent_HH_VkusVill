services:
  # ---------------------------------------------------------------
  # PGBOUNCER (Пулер соединений)
  # ---------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer
    container_name: hh_pgbouncer
    restart: always
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - LISTEN_PORT=6432
      # Исправлено на scram-sha-256, как выяснили в логах
      - AUTH_TYPE=scram-sha-256
    ports:
      - "6432:6432"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------
  # SCANNER (Общий)
  # ---------------------------------------------------------------
  hh_scanner:
    build: .
    # container_name УБРАЛИ, чтобы можно было скейлить (docker compose up -d --scale hh_scanner=2)
    restart: always
    command: python run_hh_scanner.py
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
      - ./missing_vacancies.txt:/app/missing_vacancies.txt
    depends_on:
      - pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # WORKER (Общий обработчик)
  # ---------------------------------------------------------------
  hh_worker:
    build: .
    restart: always
    command: python run_hh_worker.py
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
    depends_on:
      - pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal
    deploy:
      mode: replicated
      replicas: 1  # <-- Начинаем с 1. Нужно больше? docker compose up -d --scale hh_worker=5

  # ---------------------------------------------------------------
  # ПРИМЕР: VIP WORKER (Для конкретных рекрутеров)
  # Раскомментируй, если нужно выделить мощности под конкретных ID
  # ---------------------------------------------------------------
  # hh_worker_vip:
  #   build: .
  #   restart: always
  #   # Запускаем только для ID 1 и 5
  #   command: python run_hh_worker.py --recruiter_ids 1 5
  #   volumes:
  #     - ./logs:/app/logs
  #     - ./credentials.json:/app/credentials.json
  #   depends_on:
  #     - pgbouncer
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   env_file:
  #     - .env
  #   environment:
  #     - DB_HOST=pgbouncer
  #     - DB_PORT=6432
  #     - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # REMINDERS (Напоминатор)
  # ---------------------------------------------------------------
  hh_reminders:
    build: .
    container_name: hh_reminders
    restart: always
    command: python run_reminders_worker.py
    volumes:
      - ./logs:/app/logs
    depends_on:
      - pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # TELEGRAM BOT
  # ---------------------------------------------------------------
  tg_bot:
    build: .
    container_name: hh_tg_bot
    restart: always
    command: python run_telegram_bot.py
    volumes:
      - ./logs:/app/logs
    depends_on:
      - pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal