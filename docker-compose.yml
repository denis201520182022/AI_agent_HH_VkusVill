version: '3.8'

services:
  # ---------------------------------------------------------------
  # PGBOUNCER (Порт 6433)
  # ---------------------------------------------------------------
  vv_pgbouncer:
    image: edoburu/pgbouncer
    container_name: vv_pgbouncer
    restart: always
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
    ports:
      - "6433:6432"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------
  # SCANNER (Только 36, 49, 47)
  # ---------------------------------------------------------------
  vv_scanner_36_49_47:
    build: .
    container_name: vv_scanner_36_49_47
    restart: always
    command: python run_hh_scanner.py --recruiter_ids 36 49 47
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
      - ./missing_vacancies.txt:/app/missing_vacancies.txt
    depends_on:
      - vv_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=vv_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # WORKER (Только 36, 49, 47)
  # ---------------------------------------------------------------
  vv_worker_36_49_47:
    build: .
    container_name: vv_worker_36_49_47
    restart: always
    command: python run_hh_worker.py --recruiter_ids 36 49 47
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
    depends_on:
      - vv_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=vv_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal



