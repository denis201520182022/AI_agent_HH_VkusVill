x-limits-python: &python-limits
  deploy:
    resources:
      limits:
        cpus: '0.30'    # Максимум 30% от одного ядра процессора
        memory: 350M    # Максимум 350 МБ оперативной памяти (этого хватит для воркера)

x-monitoring-limits: &monitoring-limits
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 512M

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"       # Максимальный размер одного файла лога
      max-file: "3"         # Хранить только 3 последних файла (итого макс 30МБ на контейнер)




services:
  # ---------------------------------------------------------------
  # PGBOUNCER (Пулер соединений)
  # ---------------------------------------------------------------
  zz_pgbouncer:
    <<: *default-logging
    image: edoburu/pgbouncer
    container_name: zz_pgbouncer
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=150  # Увеличь до 150
      - RESERVE_POOL_SIZE=10   # Добавь резерв
      - QUERY_WAIT_TIMEOUT=120
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
    ports:
      - "6433:6432"
    extra_hosts:
      - "host.docker.internal:host-gateway"






  # ==========================================
  # РЕКРУТЕР 1 (ID: 6 - Долгополова Марина)
  # ==========================================
  zz_scanner_r6:
    <<: [*default-logging, *python-limits]
    build: .
    image: hh_bot_core:latest
    container_name: zz_scanner_r6
    restart: always
    command: python run_hh_scanner.py --recruiter_ids 6  
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
      - ./missing_vacancies.txt:/app/missing_vacancies.txt
    depends_on:
      - zz_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=zz_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  zz_worker_6:
    <<: [*default-logging, *python-limits]
    image: hh_bot_core:latest
    container_name: zz_worker_6
    restart: always
    command: python run_hh_worker.py --recruiter_ids 6
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
    depends_on:
      - zz_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=zz_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  # ==========================================
  # РЕКРУТЕР 2 (ID: 21 - Измайлова Анастасия)
  # ==========================================
  zz_scanner_21:
    <<: [*default-logging, *python-limits]
    image: hh_bot_core:latest
    container_name: zz_scanner_21
    restart: always
    command: python run_hh_scanner.py --recruiter_ids 21
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
      - ./missing_vacancies.txt:/app/missing_vacancies.txt
    depends_on:
      - zz_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=zz_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  zz_worker_21:
    <<: [*default-logging, *python-limits]
    image: hh_bot_core:latest
    container_name: zz_worker_21
    restart: always
    command: python run_hh_worker.py --recruiter_ids 21
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
    depends_on:
      - zz_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=zz_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # SCANNER (Общий)
  # ---------------------------------------------------------------
  zz_scanner_0:
    <<: [*default-logging, *python-limits]
    image: hh_bot_core:latest
    container_name: zz_scanner_0
    restart: always
    command: python run_hh_scanner.py --recruiter_ids
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
      - ./missing_vacancies.txt:/app/missing_vacancies.txt
    depends_on:
      - zz_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=zz_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # WORKER (Общий обработчик)
  # ---------------------------------------------------------------
  zz_worker_0:
    <<: [*default-logging, *python-limits]
    image: hh_bot_core:latest
    container_name: zz_worker_0
    restart: always
    command: python run_hh_worker.py --recruiter_ids
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
    depends_on:
      - zz_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=zz_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal
    deploy:
      mode: replicated
      replicas: 1  # <-- Начинаем с 1. Нужно больше? docker compose up -d --scale hh_worker=5


  zz_reminders:
    <<: [*default-logging, *python-limits]
    image: hh_bot_core:latest
    container_name: zz_reminders
    restart: always
    # Ограничиваем рекрутерами, чтобы не трогать базу Заботы
    command: python run_reminders_worker.py
    volumes:
      - ./logs:/app/logs
    depends_on:
      - zz_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=zz_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # TELEGRAM BOT
  # ---------------------------------------------------------------
  zz_tg_bot:
    <<: [*default-logging, *python-limits]
    image: hh_bot_core:latest
    container_name: zz_tg_bot
    restart: always
    command: python run_telegram_bot.py
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      - zz_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=zz_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

    # ---------------------------------------------------------------
  # LOKI (База данных логов)
  # ---------------------------------------------------------------
  zz_loki:
    <<: [*default-logging, *monitoring-limits]
    image: grafana/loki:2.9.2
    container_name: zz_monitoring_loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/local-config_Z.yaml:/etc/loki/local-config.yaml
      - zz_loki_data:/loki
    depends_on:
      - zz_pgbouncer # Просто чтобы запускался вместе с основной пачкой

  # ---------------------------------------------------------------
  # PROMTAIL (Сборщик логов)
  # ---------------------------------------------------------------
  zz_promtail:
    image: grafana/promtail:latest
    container_name: zz_monitoring_promtail
    user: root
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail/docker-config_Z.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - zz_loki

  # ---------------------------------------------------------------
  # GRAFANA (Визуализация)
  # ---------------------------------------------------------------
  zz_grafana:
    <<: [*default-logging, *monitoring-limits]
    image: grafana/grafana:latest
    container_name: zz_monitoring_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Логин и пароль для входа (можешь поменять)
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # Автоматическое подключение Loki
      - ./monitoring/grafana/datasource_Z.yml:/etc/grafana/provisioning/datasources/datasource.yml
      # Сохраняем настройки графаны (дашборды и т.д.) даже после перезапуска
      - zz_grafana_data:/var/lib/grafana
    depends_on:
      - zz_loki

  zz_prometheus:
    <<: [*default-logging, *monitoring-limits]
    image: prom/prometheus:latest
    container_name: zz_monitoring_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus_Z.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - zz_worker_0

# Не забудь добавить volumes в самый конец файла (корневой уровень)
volumes:
  zz_grafana_data:
  zz_loki_data: