      - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # МОНИТОРИНГ (Новые порты: Loki 3101, Grafana 3001)
  # ---------------------------------------------------------------
  vv_loki:
    image: grafana/loki:2.9.2
    container_name: vv_monitoring_loki
    restart: always
    ports:
      - "3101:3100" # Внешний порт 3101
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml
      - vv_loki_data:/loki

  vv_promtail:
    image: grafana/promtail:latest
    container_name: vv_monitoring_promtail
    user: root
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail/docker-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - vv_loki

  vv_grafana:
    image: grafana/grafana:latest
    container_name: vv_monitoring_grafana
    restart: always
    ports:
      - "3001:3000" # Внешний порт 3001
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - vv_grafana_data:/var/lib/grafana
    depends_on:
      - vv_loki

  vv_prometheus:
    image: prom/prometheus:latest
    container_name: vv_monitoring_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    

volumes:
  vv_grafana_data:
  vv_loki_data: