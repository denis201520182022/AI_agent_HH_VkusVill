version: '3.8'
x-limits-python: &python-limits
  deploy:
    resources:
      limits:
        cpus: '0.30'    
        memory: 350M   

x-monitoring-limits: &monitoring-limits
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 512M

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"       
      max-file: "3"        

services:
  # ---------------------------------------------------------------
  # PGBOUNCER (Порт 6433)
  # ---------------------------------------------------------------
  vv_pgbouncer:
    <<: *default-logging
    image: edoburu/pgbouncer
    container_name: vv_pgbouncer
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=150  
      - RESERVE_POOL_SIZE=10   
      - QUERY_WAIT_TIMEOUT=120
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
    ports:
      - "6433:6432"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------
  # SCANNER (Только 36, 49, 47)
  # ---------------------------------------------------------------
  vv_scanner_36_55_58:
    <<: [*default-logging, *python-limits]
    build: .
    image: hh_bot_core:latest
    container_name: vv_scanner_36_55_58
    restart: always
    command: python run_hh_scanner.py --recruiter_ids 36 55 58
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
      - ./missing_vacancies.txt:/app/missing_vacancies.txt
    depends_on:
      - vv_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=vv_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # WORKER (Только 36, 49, 47)
  # ---------------------------------------------------------------
  vv_worker_36_55_58:
    <<: [*default-logging, *python-limits]
    image: hh_bot_core:latest
    container_name: vv_worker_36_55_58
    restart: always
    command: python run_hh_worker.py --recruiter_ids 36 55 58
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
    depends_on:
      - vv_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=vv_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal


