  # ---------------------------------------------------------------
  # TELEGRAM BOT (Для ВкусВилла)
  # ---------------------------------------------------------------
  vv_tg_bot:
    <<: [*default-logging, *python-limits]
    image: hh_bot_core:latest
    container_name: vv_tg_bot
    restart: always
    command: python run_telegram_bot.py
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      - vv_pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=vv_pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal
      - SQUID_PROXY_HOST=${SQUID_PROXY_HOST}
      - SQUID_PROXY_PORT=${SQUID_PROXY_PORT}
      - SQUID_PROXY_USER=${SQUID_PROXY_USER}
      - SQUID_PROXY_PASSWORD=${SQUID_PROXY_PASSWORD}

  # ---------------------------------------------------------------
  # МОНИТОРИНГ (Новые порты: Loki 3101, Grafana 3001)
  # ---------------------------------------------------------------
  vv_loki:
    <<: [*default-logging, *monitoring-limits]
    image: grafana/loki:2.9.2
    container_name: vv_monitoring_loki
    restart: always
    ports:
      - "3101:3100" 
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml
      - vv_loki_data:/loki

  vv_promtail:
    <<: [*default-logging, *monitoring-limits]
    image: grafana/promtail:latest
    container_name: vv_monitoring_promtail
    user: root
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail/docker-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - vv_loki

  vv_grafana:
    <<: [*default-logging, *monitoring-limits]
    image: grafana/grafana:latest
    container_name: vv_monitoring_grafana
    restart: always
    ports:
      - "3001:3000" 
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - vv_grafana_data:/var/lib/grafana
    depends_on:
      - vv_loki

  vv_prometheus:
    <<: [*default-logging, *monitoring-limits]
    image: prom/prometheus:latest
    container_name: vv_monitoring_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'


volumes:
  vv_grafana_data:
  vv_loki_data: