services:
  # ---------------------------------------------------------------
  # PGBOUNCER (Пулер соединений)
  # ---------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer
    container_name: hh_pgbouncer
    restart: always
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - LISTEN_PORT=6432
      # Исправлено на scram-sha-256, как выяснили в логах
      - AUTH_TYPE=scram-sha-256
    ports:
      - "6432:6432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # ==========================================
  # РЕКРУТЕР 1 (ID: 6 - Долгополова Марина)
  # ==========================================
  scanner_r1:
    build: .
    container_name: hh_scanner_r1
    restart: always
    command: python run_hh_scanner.py --recruiter_ids 6  # <--- ИСПРАВЛЕНО ID
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
      - ./missing_vacancies.txt:/app/missing_vacancies.txt
    depends_on:
      - pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  worker_r1:
    build: .
    restart: always
    command: python run_hh_worker.py --recruiter_ids 6   # <--- ИСПРАВЛЕНО ID
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
    depends_on:
      - pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  # ==========================================
  # РЕКРУТЕР 2 (ID: 21 - Измайлова Анастасия)
  # ==========================================
  scanner_r2:
    build: .
    container_name: hh_scanner_r2
    restart: always
    command: python run_hh_scanner.py --recruiter_ids 21  # <--- НОВЫЙ СЕРВИС
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
      - ./missing_vacancies.txt:/app/missing_vacancies.txt
    depends_on:
      - pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  worker_r2:
    build: .
    restart: always
    command: python run_hh_worker.py --recruiter_ids 21   # <--- НОВЫЙ СЕРВИС
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
    depends_on:
      - pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # SCANNER (Общий)
  # ---------------------------------------------------------------
  hh_scanner:
    build: .
    # container_name УБРАЛИ, чтобы можно было скейлить (docker compose up -d --scale hh_scanner=2)
    restart: always
    command: python run_hh_scanner.py
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
      - ./missing_vacancies.txt:/app/missing_vacancies.txt
    depends_on:
      - pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # WORKER (Общий обработчик)
  # ---------------------------------------------------------------
  hh_worker:
    build: .
    restart: always
    command: python run_hh_worker.py
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json
    depends_on:
      - pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal
    deploy:
      mode: replicated
      replicas: 1  # <-- Начинаем с 1. Нужно больше? docker compose up -d --scale hh_worker=5

  # ---------------------------------------------------------------
  # ПРИМЕР: VIP WORKER (Для конкретных рекрутеров)
  # Раскомментируй, если нужно выделить мощности под конкретных ID
  # ---------------------------------------------------------------
  # hh_worker_vip:
  #   build: .
  #   restart: always
  #   # Запускаем только для ID 1 и 5
  #   command: python run_hh_worker.py --recruiter_ids 1 5
  #   volumes:
  #     - ./logs:/app/logs
  #     - ./credentials.json:/app/credentials.json
  #   depends_on:
  #     - pgbouncer
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   env_file:
  #     - .env
  #   environment:
  #     - DB_HOST=pgbouncer
  #     - DB_PORT=6432
  #     - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # REMINDERS (Напоминатор)
  # ---------------------------------------------------------------
  hh_reminders:
    build: .
    container_name: hh_reminders
    restart: always
    command: python run_reminders_worker.py
    volumes:
      - ./logs:/app/logs
    depends_on:
      - pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

  # ---------------------------------------------------------------
  # TELEGRAM BOT
  # ---------------------------------------------------------------
  tg_bot:
    build: .
    container_name: hh_tg_bot
    restart: always
    command: python run_telegram_bot.py
    volumes:
      - ./logs:/app/logs
    depends_on:
      - pgbouncer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=host.docker.internal

    # ---------------------------------------------------------------
  # LOKI (База данных логов)
  # ---------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.2
    container_name: monitoring_loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    depends_on:
      - pgbouncer # Просто чтобы запускался вместе с основной пачкой

  # ---------------------------------------------------------------
  # PROMTAIL (Сборщик логов)
  # ---------------------------------------------------------------
  promtail:
    image: grafana/promtail:latest  # <--- ОБНОВЛЯЕМ
    container_name: monitoring_promtail
    user: root
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail/docker-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  # ---------------------------------------------------------------
  # GRAFANA (Визуализация)
  # ---------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Логин и пароль для входа (можешь поменять)
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # Автоматическое подключение Loki
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      # Сохраняем настройки графаны (дашборды и т.д.) даже после перезапуска
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - hh_worker # Просто чтобы не стартовал раньше сети

# Не забудь добавить volumes в самый конец файла (корневой уровень)
volumes:
  grafana_data:
  loki_data: